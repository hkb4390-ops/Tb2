(function(){
  function sync(){
    document.body.classList.toggle('hrry-player-mode', /^\/player\//.test(location.pathname));
  }
  sync();
  ['pushState','replaceState'].forEach(function(k){
    var fn=history[k];
    history[k]=function(){var r=fn.apply(this,arguments);sync();return r};
  });
  addEventListener('popstate',sync);
})();
